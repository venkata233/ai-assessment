name: ci

on:
  push:
    branches: [main, master]
  pull_request:

# Least privilege: the pipeline only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service:
    name: url-shortener (lint, types, security, tests, image)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: url-shortener
    env:
      REQUIRE_INTEGRATION: "1" # a missing PostgreSQL/Redis must fail the build, not skip the tests
    steps:
      # Actions are pinned to full commit SHAs (tag in the comment).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            url-shortener/requirements.txt
            url-shortener/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check src tests migrations
          ruff format --check src tests

      - name: Type check (mypy --strict)
        run: mypy

      - name: SAST (bandit)
        run: bandit -q -r src -c pyproject.toml

      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements.txt --progress-spinner off

      - name: Start PostgreSQL and Redis (same definitions as local compose)
        run: docker compose up -d --wait postgres redis

      - name: Tests (unit, contract, integration) with coverage gate
        run: pytest -q --cov --cov-fail-under=90

      - name: Migration gates (single head, upgrade/downgrade/upgrade, model drift)
        run: |
          export DATABASE_URL="postgresql+asyncpg://shortener:shortener_dev_only@127.0.0.1:5432/shortener"
          test "$(alembic heads | grep -c '(head)')" = "1"
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check

      - name: Build image and start the full stack (AC-13)
        run: |
          docker compose up -d --build --wait app worker
          curl --fail --silent --show-error http://127.0.0.1:8000/health
          curl --fail --silent --show-error http://127.0.0.1:8000/health/ready

      - name: Smoke test create, redirect, analytics through the real containers
        run: |
          key="demo-key-local-dev-only"
          curl --fail -sS -X POST http://127.0.0.1:8000/api/v1/urls \
            -H "X-API-Key: $key" -H "Content-Type: application/json" \
            -d '{"url":"https://example.com/landing","alias":"ci-smoke"}'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/ci-smoke)" = "302"
          sleep 3
          curl --fail -sS -H "X-API-Key: $key" http://127.0.0.1:8000/api/v1/urls/ci-smoke/analytics | grep -q '"total_clicks":1'

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v
